spring:
  application:
    name: domain-common-sca
    version: 1.0.0
    description: SCA (Strong Customer Authentication) Domain Layer Application
    team:
      name: Firefly Software Foundation
      email: dev@fireflysoftware.io

  threads:
    virtual:
      enabled: true


firefly:
  security.resource-server.enabled: false
  sca.recovery.enabled: ${SCA_RECOVERY_ENABLED:false}
  cqrs:
    enabled: true
    command:
      timeout: 30s
      metrics-enabled: true
      tracing-enabled: true
    query:
      timeout: 15s
      caching-enabled: true
      cache-ttl: 15m
  saga.performance.enabled: true

  eda:
    enabled: true
    default-publisher-type: KAFKA
    default-connection-id: default
    publishers:
      kafka:
        default:
          enabled: true
          default-topic: domain-layer
          bootstrap-servers: localhost:9092

  stepevents:
    enabled: true

api-configuration:
  core-platform.sca-mgmt:
    base-path: ${ENDPOINT_CORE_SCA_MGMT:http://localhost:8040}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8041}
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    operationsSorter: method
    docExpansion: none
    filter: true
  packages-to-scan: io.fireflysoftware.domain.common.sca.web.controllers
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    io.fireflysoftware: INFO

---
spring:
  config:
    activate:
      on-profile: testing

logging:
  level:
    root: INFO
    io.fireflysoftware: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    io.fireflysoftware: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: sca-recovery-receiver
firefly:
  security:
    resource-server:
      enabled: ${SCA_RECOVERY_ENABLED:false}
      issuer: ${SCA_RECOVERY_TRUSTED_ISSUER}
      jwk-set-uri: ${SCA_RECOVERY_TRUSTED_JWKS_URI}
      audiences: ${SCA_RECOVERY_AUDIENCES}
      tenant-required: true
      tenant-claim-paths: [tenant_id]
      scope-claim-paths: [scope]
      strict-policy: true
      signature-algorithms: [RS256]
  sca:
    recovery:
      issuer: ${SCA_RECOVERY_TRUSTED_ISSUER}
      realm: ${SCA_RECOVERY_REALM}
      population: ${SCA_RECOVERY_POPULATION}
      audiences: ${SCA_RECOVERY_AUDIENCES}
      allowed-clients: ${SCA_RECOVERY_ALLOWED_CLIENTS}
      max-lifetime-seconds: ${SCA_RECOVERY_MAX_LIFETIME_SECONDS}
      core-origin: ${SCA_RECOVERY_CORE_ORIGIN}
      native-self-service-policy.enabled: ${SCA_RECOVERY_NATIVE_SELF_SERVICE_POLICY_ENABLED:false}
      native-http:
        enabled: ${SCA_RECOVERY_NATIVE_HTTP_ENABLED:false}
        base-uri: ${SCA_RECOVERY_NATIVE_RPC_URI}
        workload-username: ${SCA_RECOVERY_NATIVE_WORKLOAD_USERNAME}
        workload-password-file: ${SCA_RECOVERY_NATIVE_WORKLOAD_PASSWORD_FILE}
        timeout-seconds: ${SCA_RECOVERY_NATIVE_TIMEOUT_SECONDS}
        provider-profile: ${SCA_RECOVERY_NATIVE_PROVIDER_PROFILE}
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
